{% extends 'base.html' %}

{% block title %}Resend Verification - KayHomes{% endblock %}

{% block main_content %}
<div class="container py-5" style="max-width: 620px;">
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4 p-md-5">
      <h2 class="mb-2">Verify your email</h2>
      <p class="text-muted mb-4">Enter the email address you used to register and we’ll send a new verification link.</p>
      <form method="POST" action="{{ url_for('resend_verification') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="verification-email" class="form-label">Email address</label>
        <input id="verification-email" type="email" name="email" class="form-control" required>
        <button type="submit" class="btn btn-primary w-100 mt-4">Send verification email</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
